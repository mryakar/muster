# Vulnerabilities that OSV-Scanner, and OpenSSF Scorecard with it, finds in the dependency verification
# metadata next to this file, and that the build cannot remove yet. None is in what Muster publishes.
# Each says why it does not apply and when it goes; remove it then.

[[IgnoredVulns]]
id = "GHSA-r937-wjx7-w2jp"
reason = """Kotlin 2.4.10, which Gradle bundles to compile the Kotlin DSL of the build scripts. The \
deserialization concerns the build cache, which this build keeps local, where only the user who \
runs it can write. No Gradle release bundles Kotlin 2.4.20 or later yet; remove this with the \
Gradle upgrade that does."""

[[IgnoredVulns]]
id = "GHSA-xxph-c9ww-hj94"
reason = """Guava 30.1.1, 32.1.3 and 33.5.0, which japicmp and Spotless's formatters, \
google-java-format and ktfmt, resolve on classpaths of their own that a constraint of the build \
cannot reach; the classpaths the build controls use 33.7.2. Comparing jars and formatting sources \
never deserializes Guava's collections from untrusted data. Remove this once japicmp and the \
formatters take Guava 33.7.2 or later."""

[[IgnoredVulns]]
id = "GHSA-5mg8-w23w-74h3"
reason = """Guava 30.1.1, which japicmp resolves on a classpath of its own: temporary directories \
that other users of the machine can read. japicmp only compares two jars and writes its reports \
into the build directory. Remove this once the japicmp plugin takes Guava 32.0.0 or later."""

[[IgnoredVulns]]
id = "GHSA-7g45-4rm6-3mm3"
reason = """Guava 30.1.1, which japicmp resolves on a classpath of its own: temporary files that \
other users of the machine can read. japicmp only compares two jars and writes its reports into \
the build directory. Remove this once the japicmp plugin takes Guava 32.0.0 or later."""
