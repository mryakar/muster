[versions]
google-java-format = "1.36.1"
groovy = "5.1.3"
jackson = "3.2.3"
jacoco = "0.8.15"
jmh = "1.37"
jspecify = "1.0.1"
ktfmt = "0.65"
junit = "6.1.3"
pitest = "1.30.1"
pitest-junit5-plugin = "1.2.3"
spock = "2.5-groovy-5.0"
spring-boot = "4.1.1"

[libraries]
groovy-bom = { module = "org.apache.groovy:groovy-bom", version.ref = "groovy" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
spock-bom = { module = "org.spockframework:spock-bom", version.ref = "spock" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Tools that the build runs. They are declared as libraries only so that Dependabot updates their
# versions; the build reads the versions.
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
ktfmt = { module = "org.jetbrains.kotlinx:ktfmt", version.ref = "ktfmt" }
pitest = { module = "org.pitest:pitest", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5-plugin" }

# Gradle plugins used by the convention plugins in build-logic
cyclonedx-gradle-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version = "3.4.1" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version = "0.37.0" }
pitest-gradle-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version = "1.19.0" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version = "8.10.4" }
