version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Groovy follows the Spock variant (spock-*-groovy-5.0) and Spring Boot; move all three together.
      - dependency-name: org.apache.groovy:groovy-bom
        update-types: [version-update:semver-major]
      # The catalog names Spring Boot twice, the oldest version the starter supports and the newest;
      # Dependabot cannot tell them apart, so it offers patches only. Move spring-boot-latest to a
      # new minor version by hand.
      - dependency-name: org.springframework.boot:*
        update-types: [version-update:semver-major, version-update:semver-minor]
      # google-java-format 1.37 fails under Spotless 8.10 with NoSuchMethodError; move up with Spotless.
      - dependency-name: com.google.googlejavaformat:google-java-format
        versions: [">=1.37.0"]
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
