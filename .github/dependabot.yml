version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Groovy follows the Spock variant (spock-*-groovy-5.0) and Spring Boot; move all three together.
      - dependency-name: org.apache.groovy:groovy-bom
        update-types: [version-update:semver-major]
    groups:
      gradle:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
