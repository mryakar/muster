name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that runs third-party build code happens here, away from the secrets.
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      jar-sha256: ${{ steps.jar.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # A release builds from scratch, without caches that other workflows wrote.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - id: version
        name: Check the tag against the version and the changelog
        run: |
          version="$(.github/scripts/check-release-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: ./gradlew build publishToMavenLocal
      - name: Use the published artifacts as a consumer would
        run: |
          ./gradlew -p consumer-test run -PmusterVersion="$VERSION"
          ./gradlew -p consumer-test run -PmusterVersion="$VERSION" -PpomOnly
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - id: jar
        name: Record the checksum of the tested jar
        run: |
          sha256="$(sha256sum ~/.m2/repository/me/yakar/muster/muster-core/"$VERSION"/muster-core-"$VERSION".jar | cut -d' ' -f1)"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

  # Holds the Central and signing secrets and runs only the publishing tasks, after a maintainer
  # approves the run in the release environment.
  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # SIGNING_KEY holds only the signing subkey, so the build has to name it. Gradle takes the
      # short id, the last 8 hex digits; without it, it looks for the primary key and fails.
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: 815A97C7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Sign and publish to the local repository
        run: ./gradlew publishToMavenLocal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Check that the jar is the one that was tested
        run: |
          echo "$TESTED  $HOME/.m2/repository/me/yakar/muster/muster-core/$VERSION/muster-core-$VERSION.jar" | sha256sum --check
        env:
          TESTED: ${{ needs.verify.outputs.jar-sha256 }}
      - name: Collect the release files
        run: |
          mkdir -p release
          cp ~/.m2/repository/me/yakar/muster/muster-*/"$VERSION"/muster-* release/
          .github/scripts/release-notes.sh "$VERSION" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
      # The last step, so that a failure before it never leaves an upload behind. It uploads only:
      # the release becomes public when a maintainer publishes it in the Central Portal.
      - name: Upload to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # A separate job, so that the token that can write to the repository never meets the build or the
  # secrets.
  github-release:
    name: Draft the GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # A draft: a maintainer publishes it together with the release in the Central Portal.
      - run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
            --title "Muster $VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
