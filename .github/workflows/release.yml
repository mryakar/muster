name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The modules whose jars are released: each job checks that it handles the jar that was tested.
  JARS: muster-core muster-spring-boot-starter

jobs:
  # Everything that runs third-party build code happens here, away from the secrets.
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      jars-sha256: ${{ steps.jars.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # A release builds from scratch, without caches that other workflows wrote.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - id: version
        name: Check the tag against the version and the changelog
        run: |
          version="$(.github/scripts/check-release-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Gradle would sign with a revoked or expired key too. The subkey is the one the publish job
      # names by its short id.
      - name: Check the signing key on keys.openpgp.org
        run: .github/scripts/check-signing-key.sh 4C3AF91B1B7F67BD50D28A406CCE03949E2A4A49 46BA04A6815A97C7
      - run: ./gradlew build publishToMavenLocal
      - name: Use the published artifacts as a consumer would
        run: .github/scripts/consumer-test.sh "$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - id: jars
        name: Record the checksums of the tested jars
        run: |
          cd ~/.m2/repository/me/yakar/muster
          {
            echo 'sha256<<EOF'
            for jar in $JARS; do sha256sum "$jar/$VERSION/$jar-$VERSION.jar"; done
            echo EOF
          } >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

  # Holds the Central and signing secrets and runs only the publishing tasks, after a maintainer
  # approves the run in the release environment.
  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      # SIGNING_KEY holds only the signing subkey, so Gradle needs its short id (the last 8 hex
      # digits). Change it together with the subkey that the verify job checks.
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: 815A97C7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Sign and publish to the local repository
        run: ./gradlew publishToMavenLocal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Check that the jars are the ones that were tested
        run: |
          cd ~/.m2/repository/me/yakar/muster
          sha256sum --check <<< "$TESTED"
        env:
          TESTED: ${{ needs.verify.outputs.jars-sha256 }}
      - name: Collect the release files
        run: |
          mkdir -p release
          cp ~/.m2/repository/me/yakar/muster/muster-*/"$VERSION"/muster-* release/
          .github/scripts/release-notes.sh "$VERSION" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7
      # The last step, so that a failure before it never leaves an upload behind. It uploads only:
      # the release becomes public when a maintainer publishes it in the Central Portal.
      - name: Upload to Maven Central
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  # A separate job, so that the token that can write to the repository never meets the build or the
  # secrets.
  github-release:
    name: Draft the GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      # A draft, so that the files are in place before the release becomes immutable. The next job
      # publishes it.
      - run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag "${prerelease[@]}" \
            --title "Muster $VERSION" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}

  # Runs once a maintainer has published the Central upload and approved the release-publish
  # environment. It publishes the draft only when Maven Central serves the tested jars, so that no
  # GitHub release names a version Central lacks; the next tag's run waits until it ends.
  publish-github-release:
    name: Publish the GitHub Release
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Wait until Maven Central serves the version
        shell: bash
        run: |
          central="https://repo1.maven.org/maven2/me/yakar/muster"
          served() {
            curl -fsS --max-time 60 -o /dev/null "$central/muster-bom/$VERSION/muster-bom-$VERSION.pom" || return 1
            for jar in $JARS; do
              curl -fsS --max-time 60 --create-dirs -o "$jar/$VERSION/$jar-$VERSION.jar" \
                "$central/$jar/$VERSION/$jar-$VERSION.jar" || return 1
            done
          }
          until served; do
            echo "Maven Central does not serve $VERSION yet"
            sleep 60
          done
          sha256sum --check <<< "$TESTED"
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TESTED: ${{ needs.verify.outputs.jars-sha256 }}
      # By id, from the same listing that is checked: a lookup by tag could find another release.
      - name: Publish the draft
        shell: bash
        run: |
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | "\(.id) \(.draft)"')"
          drafts="$(grep -c ' true$' <<< "$releases" || true)"
          published="$(grep -c ' false$' <<< "$releases" || true)"
          if [[ "$published" -ne 0 ]]; then
            echo "$GITHUB_REF_NAME already has a published release" >&2
            exit 1
          fi
          if [[ "$drafts" -ne 1 ]]; then
            echo "expected one draft release for $GITHUB_REF_NAME, found $drafts" >&2
            exit 1
          fi
          id="$(grep ' true$' <<< "$releases" | cut -d' ' -f1)"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false --jq .html_url
        env:
          GH_TOKEN: ${{ github.token }}
