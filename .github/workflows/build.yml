name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      # The whole history, with the tags: check compares the API with the latest release and reads
      # the commits since it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Code is compiled with JDK 21; the matrix picks the JDK the tests run on.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build -PtestJavaVersion=${{ matrix.java }}

  # Sends the analysis to SonarQube Cloud, which shows its quality gate on the pull request; not a
  # required check. Pull requests from forks and from Dependabot get no secrets, so it is skipped
  # there. Only the step that sends the analysis sees the token, not the build and its tests.
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "No SONAR_TOKEN for this run, so no analysis."
      # The whole history, so that the analysis tells new code from old.
      - if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - if: env.HAS_SONAR_TOKEN == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - if: env.HAS_SONAR_TOKEN == 'true'
        run: ./gradlew build jacocoTestReport
      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Send the analysis
        run: ./gradlew sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The build uses the oldest Spring Boot the starter supports; this job tests the newest, on both
  # JDKs.
  spring-boot-latest:
    name: Build (Spring Boot latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test the starter against the newest Spring Boot
        run: ./gradlew :muster-spring-boot-starter:check -PspringBootVersion=latest
      - name: Test the starter against the newest Spring Boot on JDK 25
        run: ./gradlew :muster-spring-boot-starter:check -PspringBootVersion=latest -PtestJavaVersion=25

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew pitest

  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: .github/scripts/check-commit-messages.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  consumer:
    name: Consumer test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      # Without caches, as a release builds; this also checks that the dependency checksums are
      # complete.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - run: ./gradlew publishToMavenLocal
      - name: Use the published artifacts as a consumer would
        run: .github/scripts/run-examples.sh

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, with the tags: the site has a version for each release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      # A warning, such as a broken cross reference, fails the build. No package runs scripts when it
      # is installed: none needs to, and the build then runs only the code it means to.
      - name: Build the documentation site with Antora
        working-directory: docs
        run: |
          npm ci --ignore-scripts
          npm run build
