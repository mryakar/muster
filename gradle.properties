# The release whose public API japicmp compares this version with; the snapshot commit that
# follows a release sets it to that release once Maven Central serves it, and writes the checksums
# of its jars into gradle/verification-metadata.xml. A pre-release leaves it alone.
apiBaseline=0.3.0

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

